<div id="delete-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center p-4"
     role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">

  {# Backdrop #}
  <div id="delete-modal-backdrop"
       class="absolute inset-0 bg-stone-900/50 backdrop-blur-sm transition-opacity duration-200 opacity-0"></div>

  {# Panel #}
  <div id="delete-modal-panel"
       class="relative w-full max-w-md bg-white rounded-2xl shadow-xl ring-1 ring-stone-900/5 overflow-hidden
              transition-all duration-200 opacity-0 translate-y-2 scale-95">

    <div class="p-6">
      <div class="flex items-start gap-4">

        {# Warning icon #}
        <div class="w-11 h-11 rounded-full bg-rose-50 ring-1 ring-rose-200 flex items-center justify-center text-rose-600 shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
          </svg>
        </div>

        <div class="flex-1 min-w-0">
          <h2 id="delete-modal-title" class="text-lg font-semibold text-stone-800">
            Delete book?
          </h2>
          <p class="text-sm text-stone-500 mt-1.5 leading-relaxed">
            <span class="font-medium text-stone-700">“{{ book.title }}”</span> will be permanently removed.
            This action cannot be undone.
          </p>
        </div>
      </div>
    </div>

    {# Actions #}
    <div class="px-6 py-4 bg-stone-50 border-t border-stone-100 flex items-center justify-end gap-2">
      <button type="button" id="close-modal"
              class="px-4 py-2.5 text-sm font-medium text-stone-700 rounded-lg hover:bg-stone-100 transition">
        Cancel
      </button>

      <form method="post" action="{% url 'shelf:book_delete' book.id %}">
        {% csrf_token %}
        <button type="submit"
                class="inline-flex items-center gap-2 px-4 py-2.5 text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 rounded-lg shadow-sm hover:shadow transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
          </svg>
          Delete
        </button>
      </form>
    </div>

  </div>
</div>
